#This file is used to package the ReicheltAutoImport plugin.
#
#- It was generated by the InvenTree Plugin Creator tool - version 1.20.0
#- Ref: https://github.com/inventree/plugin_creator

[build-system]
requires = ["setuptools", "twine", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "inventree-reichelt-auto-import"
description = "Imports Parts from Reichelt"
dynamic = ["version"]
authors = [
    { name = "Isosloth",email = "ju@isosloth.com" },
]
readme = "README.md"
license = "MIT"
keywords = ["inventree", "plugin"]
requires-python = ">=3.9"
dependencies = [
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Framework :: InvenTree",
]
[project.urls]
Homepage = "https://github.com/isosloth/inventree-plugin-reichelt-autoimport"

[project.entry-points."inventree_plugins"]
ReicheltAutoImport = "reichelt_auto_import.core:ReicheltAutoImport"

[tool.setuptools.packages.find]
where = [""]

[tool.setuptools.dynamic]
version = {attr = "reichelt_auto_import.PLUGIN_VERSION"} 

[tool.ruff]
exclude = [
    ".git",
    "__pycache__",
    "test.py",
    "tests",
    "venv",
    "env",
    ".venv",
    ".env",
]

src=["reichelt_auto_import"]
